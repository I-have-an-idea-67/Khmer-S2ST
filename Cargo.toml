[workspace]
resolver = "2"
members = [
    "crates/khmer-linguistics-rs",
    "crates/khmer-transport-rs",
    "crates/khmer-dsp-wasm",
]

[workspace.package]
version = "10.7.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
unicode-normalization = "0.1.23"
crc32fast = "1.4.2"
regex = "1.10.6"
once_cell = "1.19.0"
crossbeam-channel = "0.5.13"
pyo3 = { version = "0.22.2", features = ["auto-initialize"] }
